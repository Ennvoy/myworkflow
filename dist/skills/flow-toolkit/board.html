<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow 開發進度看板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family:"Fira Sans", ui-sans-serif, "Microsoft JhengHei", "PingFang TC", sans-serif; color:#1e293b; }
  .mono { font-family:"Fira Code", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  .tnum { font-variant-numeric:tabular-nums; }
  /* 玻璃面板：半透明白 + backdrop blur + 淺色邊 + 柔影（folow ui-ux-pro-max glassmorphism） */
  .glass { background:rgba(255,255,255,.55); -webkit-backdrop-filter:blur(16px) saturate(140%); backdrop-filter:blur(16px) saturate(140%); border:1px solid rgba(255,255,255,.65); box-shadow:0 8px 32px rgba(15,23,42,.08); }
  .glass-card { background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.7); box-shadow:0 2px 10px rgba(15,23,42,.05); }
  .glow { text-shadow:0 0 12px currentColor; }
  .card-accent { border-left-width:3px; }
  .icn { width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:inline-block; vertical-align:-0.125em; flex:none; }
  @media (prefers-reduced-motion: no-preference) { .pulse { animation:p 2s ease-in-out infinite; } }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:.4} }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:rgba(148,163,184,.5); border-radius:6px; }
</style>
</head>
<body class="min-h-screen">

<!-- 有顏色的背景：柔和 pastel 漸層 + 模糊色塊，讓玻璃有東西折射 -->
<div class="fixed inset-0 -z-10 overflow-hidden" style="background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 45%,#ecfeff 100%)">
  <div class="absolute -top-32 -left-24 w-[28rem] h-[28rem] rounded-full" style="background:radial-gradient(circle,rgba(129,140,248,.40),transparent 70%);filter:blur(48px)"></div>
  <div class="absolute top-1/4 -right-28 w-[30rem] h-[30rem] rounded-full" style="background:radial-gradient(circle,rgba(56,189,248,.34),transparent 70%);filter:blur(48px)"></div>
  <div class="absolute -bottom-32 left-1/3 w-[30rem] h-[30rem] rounded-full" style="background:radial-gradient(circle,rgba(52,211,153,.30),transparent 70%);filter:blur(48px)"></div>
</div>

<div class="max-w-7xl mx-auto px-5 py-7">
  <header class="mb-5">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2.5">
          Flow 看板
          <span class="text-[11px] font-semibold text-emerald-600 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 glow pulse"></span>即時監控
          </span>
        </h1>
        <p id="meta" class="mono text-[13px] text-slate-500 mt-1">載入中…</p>
      </div>
      <div class="text-right">
        <div id="progress-label" class="text-sm font-medium text-slate-600 mb-1 tnum"></div>
        <div class="w-56 h-2 rounded-full overflow-hidden glass-card" style="padding:0">
          <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-500" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div id="ribbon" class="flex items-center gap-1.5 mt-4 text-[11px] font-medium"></div>
  </header>

  <section id="predicate" class="glass rounded-2xl px-4 py-3 mb-5 text-[13px] flex flex-wrap items-center gap-x-5 gap-y-1.5"></section>

  <section id="stats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6"></section>
  <section id="board" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4"></section>

  <p class="text-center text-xs text-slate-500 mt-8">
    純監控視圖，投影自當前專案的 <span class="mono text-slate-600">specs/tasks.md</span> + <span class="mono text-slate-600">.flow/</span>，每 2 秒自動刷新。決策一律回 Claude（彈窗）；卡片標 <span class="text-amber-700 font-medium">等你決策</span> 就是該回 Claude 拍板了。
  </p>
</div>

<script>
let STATUS = null;

const ICONS = {
  'check': '<path d="M20 6 9 17l-5-5"/>',
  'activity': '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  'eye': '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  'dashed': '<circle cx="12" cy="12" r="9" stroke-dasharray="3.5 3"/>',
  'ban': '<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  'alert': '<path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  'commit': '<circle cx="12" cy="12" r="3"/><path d="M3 12h6m6 0h6"/>',
  'arrow': '<path d="M5 12h14m-6-6 6 6-6 6"/>',
};
const ic = (n, cls = '') => `<svg class="icn ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const STATE = {
  "delivered":      { label: "已交付", icon: "check",  dot: "bg-emerald-500", text: "text-emerald-700", bar: "border-emerald-400" },
  "building":       { label: "開發中", icon: "activity", dot: "bg-sky-500",    text: "text-sky-700",     bar: "border-sky-400" },
  "verifying":      { label: "驗收中", icon: "eye",    dot: "bg-amber-500",   text: "text-amber-700",   bar: "border-amber-400" },
  "pending":        { label: "待開發", icon: "dashed", dot: "bg-slate-400",   text: "text-slate-500",   bar: "border-slate-300" },
  "blocked":        { label: "卡依賴", icon: "ban",    dot: "bg-rose-500",    text: "text-rose-700",    bar: "border-rose-400" },
  "needs-decision": { label: "等你決策", icon: "alert", dot: "bg-amber-500",  text: "text-amber-800",   bar: "border-amber-500" },
};
const COLUMNS = [
  { title: "待開發", states: ["needs-decision", "pending", "blocked"], accent: "text-slate-600", line: "bg-slate-400" },
  { title: "開發中", states: ["building"],                            accent: "text-sky-700",   line: "bg-sky-500" },
  { title: "驗收中", states: ["verifying"],                           accent: "text-amber-700", line: "bg-amber-500" },
  { title: "已交付", states: ["delivered"],                           accent: "text-emerald-700", line: "bg-emerald-500" },
];
const SECTION_BADGE = { prelude: "P", features: "F", "cross-cutting": "X", backlog: "B" };
const STAT_DEFS = [
  { label: "已交付", states: ["delivered"],          cls: "text-emerald-600" },
  { label: "開發中", states: ["building"],           cls: "text-sky-600" },
  { label: "驗收中", states: ["verifying"],          cls: "text-amber-600" },
  { label: "待開發", states: ["pending", "blocked"], cls: "text-slate-600" },
  { label: "等你決策", states: ["needs-decision"],   cls: "text-amber-700" },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const count = states => STATUS.features.filter(f => states.includes(f.state)).length;

async function poll() {
  try { STATUS = await (await fetch('/status.json', { cache: 'no-store' })).json(); render(); } catch (e) {}
}

const PHASES = ["spec", "plan", "build", "verify", "ship"];
function ribbon() {
  const cur = (STATUS.phase || '').toLowerCase();
  return PHASES.map((p, i) => {
    const on = cur.startsWith(p);
    const cls = on ? "bg-emerald-500/20 text-emerald-800 ring-1 ring-emerald-400/60" : "glass-card text-slate-500";
    const sep = i < PHASES.length - 1 ? `<span class="text-slate-400">${ic('arrow')}</span>` : '';
    return `<span class="mono px-2.5 py-1 rounded-lg ${cls}">${p}</span>${sep}`;
  }).join('');
}

function predicate() {
  const p = STATUS.predicate || {};
  const chip = (label, ok, remain) => {
    if (ok === true)  return `<span class="text-emerald-700 flex items-center gap-1">${ic('check')}${label}</span>`;
    if (ok === null)  return `<span class="text-slate-400 flex items-center gap-1">${ic('dashed')}${label} <span class="text-slate-400">(需 ship 驗)</span></span>`;
    return `<span class="text-rose-700 flex items-center gap-1">${ic('ban')}${label}${remain ? `<span class="text-rose-500">${remain}</span>` : ''}</span>`;
  };
  const ready = p.pf === true && p.xcut === true && p.e2e === true && p.perf === true;
  return [
    `<span class="font-semibold text-slate-700">完成謂詞</span>`,
    chip("P/F 全交付", p.pf, p.pfRemain ? `差 ${p.pfRemain}` : ''),
    chip("REQ-E2E", p.e2e),
    chip("REQ-PERF", p.perf),
    chip("X-* 清空", p.xcut, p.xcutRemain ? `未清 ${p.xcutRemain}` : ''),
    `<span class="ml-auto font-semibold px-2.5 py-1 rounded-lg ${ready ? 'bg-emerald-500/20 text-emerald-800 ring-1 ring-emerald-400/60' : 'bg-amber-400/20 text-amber-800 ring-1 ring-amber-400/50'}">${ready ? '✓ 可出貨' : '尚不可 ship'}</span>`,
  ].join('');
}

function render() {
  if (!STATUS) return;
  document.getElementById('meta').textContent =
    `${STATUS.project} · HEAD ${STATUS.updatedCommit || '—'} · phase ${STATUS.phase || '?'}`;
  document.getElementById('ribbon').innerHTML = ribbon();
  document.getElementById('predicate').innerHTML = predicate();

  const total = STATUS.features.length, done = count(['delivered']);
  document.getElementById('progress-label').textContent = `已交付 ${done} / ${total}`;
  document.getElementById('progress-bar').style.width = `${total ? Math.round(done / total * 100) : 0}%`;

  document.getElementById('stats').innerHTML = STAT_DEFS.map(s => {
    const n = count(s.states);
    const pop = s.label === '等你決策' && n > 0 ? ' ring-2 ring-amber-400/60' : '';
    return `<div class="glass rounded-2xl px-4 py-3${pop}">
      <div class="text-2xl font-bold tnum ${s.cls}">${n}</div>
      <div class="text-xs text-slate-500 mt-0.5">${s.label}</div></div>`;
  }).join('');

  document.getElementById('board').innerHTML = COLUMNS.map(col => {
    const items = STATUS.features.filter(f => col.states.includes(f.state))
      .sort((a, b) => (b.state === 'needs-decision') - (a.state === 'needs-decision'));
    const cards = items.length ? items.map(card).join('') : `<p class="text-xs text-slate-400 italic px-1 py-3">（無）</p>`;
    return `<div class="glass rounded-2xl p-3">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold ${col.accent} flex items-center gap-2">
          <span class="w-1.5 h-4 rounded-full ${col.line}"></span>${col.title}</span>
        <span class="text-xs text-slate-400 tnum">${items.length}</span></div>
      <div class="space-y-2">${cards}</div></div>`;
  }).join('');
}

function card(f) {
  const st = STATE[f.state] || STATE.pending;
  const need = f.state === 'needs-decision';
  const secBadge = SECTION_BADGE[f.section]
    ? `<span class="mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200/80 text-slate-600">${SECTION_BADGE[f.section]}</span>` : '';
  const tddVer = (f.tdd || f.verify)
    ? `<div class="mono text-[11px] text-slate-500 mt-1.5">${f.tdd ? 'tdd=' + esc(f.tdd) : ''}${f.tdd && f.verify ? ' · ' : ''}${f.verify ? 'verify=' + esc(f.verify) : ''}</div>` : '';
  const sub = need
    ? `<div class="text-xs text-amber-900 mt-1.5">${esc(f.decision || '需要你決策')}</div>
       <div class="text-[11px] text-amber-700 mt-1 font-medium flex items-center gap-1">${ic('arrow')} 回 Claude 拍板（彈窗）</div>`
    : f.note ? `<div class="text-xs text-slate-500 mt-1.5">${esc(f.note)}</div>`
    : f.blockedBy ? `<div class="text-xs text-rose-600 mt-1.5 flex items-center gap-1">${ic('ban')} 卡 ${esc(f.blockedBy)} 未完</div>` : '';
  const foot = f.commit ? `<span class="mono text-[11px] text-slate-400 flex items-center gap-1">${ic('commit')}${esc(f.commit)}</span>` : '';
  const cardCls = need ? 'ring-2 ring-amber-400/60' : 'glass-card';
  const bg = need ? 'background:rgba(254,243,199,.78)' : '';
  return `<div class="rounded-xl card-accent ${st.bar} ${cardCls} px-3 py-2.5" style="${bg}">
    <div class="flex items-center gap-2 flex-wrap">
      ${secBadge}<span class="mono text-xs font-bold text-slate-700">${esc(f.id)}</span>
      <span class="text-sm font-medium text-slate-800">${esc(f.name)}</span></div>
    ${tddVer}${sub}
    <div class="flex items-center justify-between mt-2.5">
      <span class="text-[11px] px-1.5 py-0.5 rounded flex items-center gap-1 font-medium ${st.text}">
        <span class="w-1.5 h-1.5 rounded-full ${st.dot}"></span>${ic(st.icon)}${st.label}</span>${foot}</div></div>`;
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
